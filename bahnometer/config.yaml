name: Bahnometer
version: "2.1.0"
slug: bahnometer
description: RE und RB zwischen Ingolstadt und Pfaffenhofen mit Echtzeitdaten von Transitous.
url: https://github.com/CommanderReiker/Bahnometer
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Optionaler HTTP-Zugriff im lokalen Netzwerk
panel_icon: mdi:train
panel_title: Bahnometer
panel_admin: false
watchdog: "http://[HOST]:[PORT:8099]/api/health"
timeout: 30
options:
  data_source: transitous
  default_origin: home
schema:
  data_source: list(transitous|bahn|auto)
  default_origin: list(home|work)
